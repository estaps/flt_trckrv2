# Self-contained test stack with its own Postgres. Run:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: flighttracker
      POSTGRES_PASSWORD: flighttracker
      POSTGRES_DB: flighttracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flighttracker"]
      interval: 5s
      retries: 10

  app:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://flighttracker:flighttracker@postgres:5432/flighttracker?schema=flighttracker
      HOME_CURRENCY: USD
      FILES_DIR: /data/files
      BACKUP_BEFORE_MIGRATE: "true"
      BACKUP_DIR: /data/backups
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://flighttracker:flighttracker@postgres:5432/flighttracker?schema=flighttracker
      FILES_DIR: /data/files
      SKIP_MIGRATIONS: "true"

volumes:
  pgdata:
