# Production: connects to an existing Postgres server via DATABASE_URL in .env.
services:
  app:
    build: .
    image: flight-tracker:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Watches the import mailbox (IMAP_* settings) and feeds new emails into the review inbox.
  worker:
    image: flight-tracker:latest
    restart: unless-stopped
    env_file: .env
    environment:
      SKIP_MIGRATIONS: "true"
    command: ["node", "worker.js"]
    volumes:
      - ./data:/data
    depends_on:
      app:
        condition: service_healthy
